# Requires build/compile_commands.json to already exist (run `cmake --preset
# default` at least once) before clang-tidy/cppcheck hooks can analyze anything.
# Install into this repo with: pre-commit install
# After first install, run `pre-commit autoupdate` to repin the clang-format
# mirror's `rev` to a tag matching the installed clang-format-21 exactly.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --quiet
        language: system
        types_or: [c++, c]
        pass_filenames: true

      - id: cppcheck
        name: cppcheck
        # --language=c++ is required: cppcheck guesses C vs C++ from the file
        # extension alone, and misidentifies every .h header in this
        # all-C++ project as C, erroring on anything using std:: types.
        entry: cppcheck --language=c++ --enable=warning,performance,portability --error-exitcode=1 --suppress=missingInclude
        language: system
        types_or: [c++, c]
        pass_filenames: true
