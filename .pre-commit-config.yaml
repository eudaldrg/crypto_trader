# Requires build/debug/compile_commands.json to already exist (run
# `cmake --preset debug` at least once) before clang-tidy/cppcheck hooks can
# analyze anything.
#
# Two enforcement tiers -- see decisions/0005-quality-gates-and-release-process.md
# for the full reasoning, including what is deliberately NOT enforced yet
# (coverage thresholds, release/perf checks):
#   - commit-time (default stage): format, lint, and an actual incremental
#     build -- a commit must at least compile.
#   - push-time (pre-push stage): the full test suite under every sanitizer
#     configuration this project uses. Install both stages with:
#       pre-commit install
#       pre-commit install --hook-type pre-push
# After first install, run `pre-commit autoupdate` to repin the clang-format
# mirror's `rev` to a tag matching the installed clang-format-21 exactly.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build/debug --quiet
        language: system
        types_or: [c++, c]
        pass_filenames: true

      - id: cppcheck
        name: cppcheck
        # --language=c++ is required: cppcheck guesses C vs C++ from the file
        # extension alone, and misidentifies every .h header in this
        # all-C++ project as C, erroring on anything using std:: types.
        # --library=googletest teaches it TEST/TEST_F's macro expansion, so
        # it doesn't matter what order they appear in a file -- supersedes
        # the "keep TEST macros in a specific order" workaround CLAUDE.md
        # used to document for this.
        entry: cppcheck --language=c++ --library=googletest --enable=warning,performance,portability --error-exitcode=1 --suppress=missingInclude
        language: system
        types_or: [c++, c]
        pass_filenames: true

      - id: build
        name: incremental build (build/debug must compile)
        entry: scripts/check_build.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: sanitizer-suite
        name: full test suite under ASan+UBSan and ThreadSanitizer
        entry: scripts/run_sanitizers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
